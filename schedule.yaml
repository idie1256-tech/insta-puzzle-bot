# 요일별 카테고리 (한국 시간 기준)
# 매주 하루는 원래 카테고리 대신 '추가 카테고리' 하나가 들어간다.
#   - 바뀌는 요일   : (ISO 주차 % 7) 번째 요일 (0=월 … 6=일)
#   - 들어갈 카테고리: extras[(ISO 주차 % 4)]
# 오늘 무엇을 올릴지: python scripts/today_category.py
# 이번 주 전체 보기 : python scripts/today_category.py --week

weekdays:
  - 어휘력      # 월: 뜻·맞춤법·헷갈리는 말
  - 수열        # 화: 규칙 찾기, 숫자 패턴
  - 상식        # 수: 잘 모르는 사실 (검색으로 검증)
  - 논리        # 목: 거짓말쟁이·순서 추리 등 조건 추론
  - 성냥개비    # 금: scripts/matchstick.py 로 답이 하나뿐인지 검증
  - 넌센스      # 토: 말장난·발상 전환
  - 창의력      # 일: 선 하나 긋기처럼 규칙을 비트는 문제

extras:
  - 자물쇠·암호  # 단서로 비밀번호 찾기 (type: lock)
  - 도형 세기    # 삼각형·사각형 몇 개? (코드로 개수 검증)
  - 공간지각    # 전개도·주사위·쌓기나무
  - 초성 퀴즈    # 초성으로 속담·사자성어 맞히기
