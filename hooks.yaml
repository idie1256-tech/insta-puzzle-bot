# 릴스 상단 후킹 제목 모음
# 규칙
#  - 모든 문제는 반드시 후킹 제목(hook)을 단다. 밋밋한 설명형("다음 문제를 풀어보세요") 금지.
#  - 2줄, 한 줄에 9글자 안팎(공백 포함). 줄바꿈은 "\n".
#  - 최근 게시물 3개와 같은 문구는 쓰지 않는다. 같은 유형도 이틀 연속은 피한다.
#  - 아래 문구를 그대로 쓰거나 숫자·대상만 바꿔 변형해도 된다. 카테고리에 맞는 대상을 넣으면 더 좋다.
#  - 문제 소재 이름을 넣어도 된다(강현 선호). 예: "99%가 틀리는\n거짓말쟁이 문제", "상위 1%만 푸는\n성냥개비 문제".
#
# 제목 점검 — 제목을 정한 뒤, 문제를 직접 풀어 보고 아래를 모두 확인한다. 하나라도 걸리면 다른 문구로 바꾼다.
#  1. 이 문제에 실제로 맞는 말인가? 제목이 말하는 상황·함정·대상이 문제와 일치해야 한다.
#     예) "암산으로/계산기 없이" → 계산 문제일 때만. "국어 선생님도" → 어휘 문제일 때만.
#         "다들 N번 고르는데" → N번이 실제로 그럴듯한 오답일 때만.
#  2. 시간 문구("바로", "N초 만에/안에")는 문제를 읽고 푸는 데 실제로 그 시간이면 되는 경우에만 쓴다.
#     여러 줄 지문·조건이 있는 문제(논리, 거짓말쟁이 등)에는 시간 도전형을 쓰지 않는다.
#  3. 두 공식을 한 제목에 섞지 않는다(예: 시간 조건 + 비율 = "1초 만에 답하면 100% 틀림" ✗ — 4줄짜리 논리 문제라 1초에 답할 수도 없음).
#  4. 소리 내어 읽었을 때 자연스러운 한국어인가?
#  ※ "100%", "무조건", "절대" 같은 단정 표현은 써도 된다(강현 허용, 2026-11-12). 단, 위 1~4번 점검은 그대로 적용한다.

비율형:
  - "요즘 20대\n97%가 틀린 문제"
  - "성인 91%가\n절대 못 푸는 문제"
  - "의외로 많이\n틀린다는 문제"
  - "99%가\n틀리는 문제"
  - "상위 1%만\n맞추는 문제"
  - "성인 90%가\n틀리는 문제"
  - "100명 중 1명만\n맞추는 문제"
  - "상위 0.1%만\n맞추는 문제"
  - "99%가 틀리는\n거짓말쟁이 문제"   # 소재 이름을 넣은 변형 — 강현이 가장 무난하다고 고른 형식

시간_도전형:
  - "바로 풀면\n천재"
  - "암산으로\n풀 수 있나요?"
  - "계산기 없이 맞히면\n진짜 인정"
  - "3초 만에 맞추면\n천재"
  - "10초 안에 풀면\n상위 1%"
  - "5초 안에\n풀 수 있을까?"

친구_도전형:   # 공유(친구에게 보내기)를 부르는 유형 — 가장 자주 쓰기
  - "친구는\n못 푸는 문제"
  - "친구한테 보내서\n테스트해 보세요"
  - "이거 맞추면\n친구보다 똑똑함"
  - "단톡방에 올리면\n답이 갈리는 문제"

자격형:
  - "미국 대학\n시험 문제"
  - "IQ 140 이상만\n보이는 답"
  - "성인도 암산은\n어려운 문제"
  - "다 맞으면\n상위권"
  - "천재만\n푸는 문제"
  - "IQ 150만\n푸는 문제"
  - "수학 고수도\n틀리는 문제"      # 수열·성냥개비·논리
  - "국어 선생님도\n헷갈리는 문제"   # 어휘력
  - "어른들도\n틀리는 문제"          # 상식·넌센스
  - "명문대생도\n틀린 문제"

반전형:
  - "초등학생도\n풀 수 있는 퀴즈"      # 역도발: 쉬워 보이게 해서 틀리게 만들기
  - "다들 2번 고르는데\n정답은?"      # 숫자는 실제로 많이 고를 오답 번호로. ①② 같은 원 문자는 글꼴이 깨져서 쓰지 않음
  - "쉬워 보이지만\n99%가 틀림"
  - "답 보면\n소름 돋는 문제"
