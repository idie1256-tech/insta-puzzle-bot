# 릴스 상단 후킹 제목 모음
# 규칙
#  - 모든 문제는 반드시 후킹 제목(hook)을 단다. 밋밋한 설명형("다음 문제를 풀어보세요") 금지.
#  - 2줄, 한 줄에 9글자 안팎(공백 포함). 줄바꿈은 "\n".
#  - 최근 게시물 3개와 같은 문구는 쓰지 않는다. 같은 유형도 이틀 연속은 피한다.
#  - 아래 문구를 그대로 쓰거나 숫자·대상만 바꿔 변형해도 된다. 카테고리에 맞는 대상을 넣으면 더 좋다.

비율형:
  - "99%가\n틀리는 문제"
  - "상위 1%만\n맞추는 문제"
  - "성인 90%가\n틀리는 문제"
  - "100명 중 1명만\n맞추는 문제"
  - "상위 0.1%만\n맞추는 문제"

시간_도전형:
  - "3초 만에 맞추면\n천재"
  - "10초 안에 풀면\n상위 1%"
  - "5초 안에\n풀 수 있을까?"
  - "1초 만에 답하면\n100% 틀림"

친구_도전형:   # 공유(친구에게 보내기)를 부르는 유형 — 가장 자주 쓰기
  - "친구는\n못 푸는 문제"
  - "친구한테 보내서\n테스트해 보세요"
  - "이거 맞추면\n친구보다 똑똑함"
  - "단톡방에 올리면\n답이 갈리는 문제"

자격형:
  - "천재만\n푸는 문제"
  - "IQ 150만\n푸는 문제"
  - "수학 고수도\n틀리는 문제"      # 수열·성냥개비·논리
  - "국어 선생님도\n헷갈리는 문제"   # 어휘력
  - "어른들도\n틀리는 문제"          # 상식·넌센스
  - "명문대생도\n틀린 문제"

반전형:
  - "다들 2번 고르는데\n정답은?"      # 숫자는 실제로 많이 고를 오답 번호로. ①② 같은 원 문자는 글꼴이 깨져서 쓰지 않음
  - "쉬워 보이지만\n99%가 틀림"
  - "답 보면\n소름 돋는 문제"
