# 인스타 창의력 문제 목록
# 위에서부터 순서대로 하나씩 게시됩니다. 새 문제는 맨 아래에 추가하세요.
#
# 공통 항목
#   id          : 번호 (겹치면 안 됨, 배지에 "No.01"처럼 표시)
#   type        : lock(자물쇠) | sequence(수열) | rows(식·문장 나열)
#   difficulty  : 하 | 중 | 상
#   hook        : 릴스 맨 위 후킹 문구 (없으면 title을 크게 표시). 줄을 나누려면 "첫 줄\n둘째 줄"처럼 따옴표 안에 \n
#   title       : 큰 제목
#   seconds     : 릴스 생각할 시간(초). 없으면 config.yaml의 reel_seconds
#   subtitle    : 제목 아래 설명
#   hint        : 이미지 하단 힌트 (없으면 비워두기)
#   answer      : 정답 (기록용)
#   caption     : 인스타 캡션 (정답 포함, "." 줄 아래에 정답을 두면 바로 안 보임)

puzzles:
  - id: 1
    type: lock
    difficulty: 중
    hook: "단서 5개로\n자물쇠를 열 수 있을까?"
    title: 자물쇠의 비밀번호는?
    subtitle: 아래 단서만으로 세 자리 숫자를 찾아보세요
    clues:
      - { digits: "804", text: "숫자 1개가 맞고, 자리도 맞음" }
      - { digits: "961", text: "숫자 1개가 맞지만, 자리가 틀림" }
      - { digits: "407", text: "숫자 2개가 맞지만, 자리가 모두 틀림" }
      - { digits: "368", text: "맞는 숫자가 하나도 없음" }
      - { digits: "148", text: "숫자 1개가 맞지만, 자리가 틀림" }
    hint:
    answer: "794"
    caption: |
      🔐 이 자물쇠의 비밀번호는?
      단서 5개만으로 풀 수 있어요. 댓글로 먼저 답을 남겨보세요!
      .
      .
      .
      .
      .
      .
      🔓 정답: 794

      ① 3 6 8 → 3, 6, 8은 비밀번호에 없어요.
      ② 8 0 4 → 8이 없으니 0이나 4가 제자리예요.
         그런데 0이 둘째 자리라면 4 0 7에서도 0이 제자리가 되니 모순!
         → 4는 셋째 자리, 0은 없음
      ③ 4 0 7 → 0이 없으니 맞는 두 숫자는 4와 7 → 7은 비밀번호에 있음
      ④ 1 4 8 → 맞는 하나는 4 → 1은 없음
      ⑤ 9 6 1 → 6과 1이 없으니 9가 맞음, 첫째 자리는 아님 → 둘째 자리
      ⑥ 남은 첫째 자리는 7

      👉 7 9 4

      맞히신 분은 댓글에 🔓 남겨주세요!

      #창의력문제 #방탈출 #두뇌게임 #추리문제 #자물쇠문제

  - id: 2
    type: exam
    difficulty: 상
    hook: "상위 0.1%만\n맞추는 문제"
    title: 다음에 올 숫자는?
    exam_period: 제2교시
    exam_label: 수학 영역
    question: 규칙을 찾아 ?에 알맞은 수를 쓰시오.
    equations: ["2", "12", "1112", "3112", "?"]
    blank: true
    answer: "132112"
    explanation: "앞의 숫자를 소리 내어 읽은 대로 쓰는 '개미 수열'이에요. 2 → '2가 1개'(12) → '1이 1개, 2가 1개'(1112) → '1이 3개, 2가 1개'(3112) → '3이 1개, 1이 2개, 2가 1개'(132112)."
    caption: |
      🔢 2 → 12 → 1112 → 3112 → ?
      상위 0.1%만 맞추는 문제, 도전해 보세요!
      숫자 하나만 댓글로 남겨주세요 👇
      정답은 내일 공개합니다!

      #창의력문제 #개미수열 #수열문제 #두뇌게임 #퀴즈

  # ── 인기 게시물 패턴 적용 (시험지 형식 · 3초 난이도 + 함정 · 단답 · 캡션에 정답 없음) ──
  # exam 유형 항목
  #   exam_period : 왼쪽 동그란 표시 (예: 제1교시, 초등 3학년)
  #   exam_label  : 영역 이름 (예: 국어 영역)
  #   question    : 문제 문장
  #   passage     : 네모 칸 지문 (선택)
  #   equations   : 크게 보여줄 식 목록 (선택)
  #   choices     : 객관식 보기 목록 (선택, ①부터 자동 번호)
  #   blank       : true면 '답: (   )' 칸 표시 (주관식)
  #   explanation : 정답 해설 (다음 날 정답 공개용)

  - id: 3
    type: exam
    difficulty: 하
    hook: "100명 중 몇 명이\n맞힐까?"
    title: 글피는 무슨 요일?
    exam_period: 제1교시
    exam_label: 국어 영역
    question: 오늘이 화요일이라면, '글피'는 무슨 요일일까요?
    choices: [수요일, 목요일, 금요일, 토요일, 일요일]
    answer: "③ 금요일"
    explanation: 내일(수) → 모레(목) → 글피(금). 글피는 '모레의 다음 날'이에요. 그다음 날은 '그글피'예요.
    caption: |
      📝 오늘이 화요일이면, '글피'는 무슨 요일?
      번호 하나만 댓글로 남겨주세요 👇
      정답은 내일 공개합니다!

      #창의력문제 #문해력 #국어퀴즈 #두뇌게임 #퀴즈

  - id: 4
    type: exam
    difficulty: 하
    hook: "2일까, 8일까?\n당신의 답은?"
    title: 12 ÷ 3 × (1 + 1) = ?
    exam_period: 제2교시
    exam_label: 수학 영역
    question: 다음 식을 계산하시오.
    equations: ["12 ÷ 3 × (1 + 1)"]
    blank: true
    answer: "8"
    explanation: 괄호 먼저(1 + 1 = 2), 곱셈과 나눗셈은 앞에서부터 차례로 계산해요. 12 ÷ 3 = 4, 4 × 2 = 8. 곱셈을 먼저 해서 2가 나왔다면 함정에 걸린 거예요.
    caption: |
      🧮 12 ÷ 3 × (1 + 1) = ?
      2일까, 8일까? 숫자 하나만 댓글로 👇
      정답은 내일 공개합니다!

      #창의력문제 #수학퀴즈 #계산문제 #두뇌게임 #퀴즈

  - id: 5
    type: exam
    difficulty: 중
    hook: "정답이 2개!\n둘 다 찾을 수 있을까?"
    title: 6 + 8 = ?
    exam_period: 제2교시
    exam_label: 수학 영역
    question: 규칙을 찾아 ?에 알맞은 수를 쓰시오.
    equations: ["1 + 3 = 4", "2 + 4 = 10", "3 + 5 = 18", "6 + 8 = ?"]
    blank: true
    answer: "54 또는 32 (둘 다 정답)"
    explanation: "① a + a × b 규칙: 6 + 6 × 8 = 54 ② 앞줄 답에 더해 가는 규칙: 18 + 6 + 8 = 32. 앞의 세 줄은 두 규칙 모두 맞아요."
    caption: |
      ➕ 1+3=4, 2+4=10, 3+5=18 … 6+8=?
      정답이 두 개예요. 내가 찾은 답을 댓글로 👇
      둘 다 찾으면 진짜 고수!
      정답은 내일 공개합니다.

      #창의력문제 #수학퀴즈 #규칙찾기 #두뇌게임 #퀴즈

  - id: 6
    type: exam
    difficulty: 하
    hook: "3초 안에\n답할 수 있을까?"
    title: 28일이 있는 달은 몇 개?
    exam_period: 초등 3학년
    exam_label: 생각하는 수학
    question: 1년 중 28일이 있는 달은 모두 몇 개일까요?
    blank: true
    answer: "12개"
    explanation: 모든 달에 28일이 있어요. 2월만 떠올렸다면 '28일까지만 있는 달'과 헷갈린 거예요.
    caption: |
      📅 1년 중 28일이 있는 달은 모두 몇 개?
      3초 안에 숫자 하나로 답해주세요 👇
      정답은 내일 공개합니다!

      #창의력문제 #넌센스퀴즈 #초등문제 #두뇌게임 #퀴즈

  - id: 7
    type: exam
    difficulty: 하
    hook: "1초 만에 답하면\n틀리는 문제"
    title: 2등을 앞지르면 몇 등?
    exam_period: 초등 2학년
    exam_label: 생각 키우기
    question: 달리기 시합에서 2등으로 달리던 친구를 내가 앞질렀어요. 지금 나는 몇 등일까요?
    choices: [1등, 2등, 3등]
    answer: "② 2등"
    explanation: 2등을 앞지르면 그 자리를 차지하는 거라 2등이에요. 1등이 되려면 1등을 앞질러야 해요.
    caption: |
      🏃 달리기에서 2등을 앞질렀다면, 나는 지금 몇 등?
      번호 하나만 댓글로 👇
      정답은 내일 공개합니다!

      #창의력문제 #넌센스퀴즈 #초등문제 #두뇌게임 #퀴즈
