# 인스타 창의력 문제 목록
# 위에서부터 순서대로 하나씩 게시됩니다. 새 문제는 맨 아래에 추가하세요.
#
# 공통 항목
#   id          : 내부 번호 (겹치면 안 됨, 게시 기록·실행에 사용)
#   num         : 화면 배지에 보일 번호 (없으면 id). 예: num: 1 → "No.01"
#   type        : lock(자물쇠) | sequence(수열) | rows(식·문장 나열) | exam(시험지)
#   category    : schedule.yaml의 카테고리 이름 (요일별 순환에 사용)
#   difficulty  : 하 | 중 | 상
#   hook        : 릴스 맨 위 후킹 문구 (없으면 title을 크게 표시). 줄을 나누려면 "첫 줄\n둘째 줄"처럼 따옴표 안에 \n
#   title       : 큰 제목
#   seconds     : 릴스 생각할 시간(초). 없으면 config.yaml의 reel_seconds
#   subtitle    : 제목 아래 설명
#   hint        : 이미지 하단 힌트 (없으면 비워두기)
#   answer      : 정답 (기록용)
#   caption     : 인스타 캡션 (정답 포함, "." 줄 아래에 정답을 두면 바로 안 보임)

puzzles:
  - id: 1
    type: lock
    category: 자물쇠·암호
    difficulty: 중
    hook: "단서 5개로\n자물쇠를 열 수 있을까?"
    title: 자물쇠의 비밀번호는?
    subtitle: 아래 단서만으로 세 자리 숫자를 찾아보세요
    clues:
      - { digits: "804", text: "숫자 1개가 맞고, 자리도 맞음" }
      - { digits: "961", text: "숫자 1개가 맞지만, 자리가 틀림" }
      - { digits: "407", text: "숫자 2개가 맞지만, 자리가 모두 틀림" }
      - { digits: "368", text: "맞는 숫자가 하나도 없음" }
      - { digits: "148", text: "숫자 1개가 맞지만, 자리가 틀림" }
    hint:
    answer: "794"
    caption: |
      🔐 이 자물쇠의 비밀번호는?
      단서 5개만으로 풀 수 있어요. 댓글로 먼저 답을 남겨보세요!
      .
      .
      .
      .
      .
      .
      🔓 정답: 794

      ① 3 6 8 → 3, 6, 8은 비밀번호에 없어요.
      ② 8 0 4 → 8이 없으니 0이나 4가 제자리예요.
         그런데 0이 둘째 자리라면 4 0 7에서도 0이 제자리가 되니 모순!
         → 4는 셋째 자리, 0은 없음
      ③ 4 0 7 → 0이 없으니 맞는 두 숫자는 4와 7 → 7은 비밀번호에 있음
      ④ 1 4 8 → 맞는 하나는 4 → 1은 없음
      ⑤ 9 6 1 → 6과 1이 없으니 9가 맞음, 첫째 자리는 아님 → 둘째 자리
      ⑥ 남은 첫째 자리는 7

      👉 7 9 4

      맞히신 분은 댓글에 🔓 남겨주세요!

      #창의력문제 #방탈출 #두뇌게임 #추리문제 #자물쇠문제

