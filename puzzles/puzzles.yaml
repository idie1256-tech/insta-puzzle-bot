    explanation: "주사위는 윗면과 아랫면처럼 마주 보는 두 면의 합이 7이에요. 아래 두 주사위는 윗면·아랫면이 모두 가려져 7 + 7 = 14, 맨 위 주사위는 윗면이 5라서 가려진 아랫면은 7 − 5 = 2. 14 + 2 = 16. 옆면 눈은 몰라도 풀 수 있어요! (주사위 3개의 24×24×24가지 방향을 코드로 전부 확인 — 합은 언제나 21 − 맨 위 윗면)"
