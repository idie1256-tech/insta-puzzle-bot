name: 인스타 자동 게시

# 자동 예약 게시는 꺼져 있습니다. 검토를 마친 문제만 번호를 지정해 직접 실행합니다.
# 다시 매일 자동으로 올리려면 아래 주석을 풀면 됩니다 (UTC 기준, 한국 시간 20:07 = "7 11 * * *").
#  schedule:
#    - cron: "7 11 * * *"
on:
  workflow_dispatch:
    inputs:
      puzzle_id:
        description: "올릴 문제 번호 (검토를 마친 문제만)"
        required: true
      dry_run:
        description: "체크하면 이미지만 만들고 실제 게시는 하지 않음 (연습용)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 프로그램 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 토큰과 계정 연결 확인
        run: python scripts/publish.py --check

      - name: 올릴 문제 확인
        id: pick
        run: |
          if [ -z "${{ inputs.puzzle_id }}" ]; then echo "올릴 문제 번호를 입력해주세요."; exit 1; fi
          python scripts/post_queue.py next "${{ inputs.puzzle_id }}"

      - name: 이미지 만들기
        run: python scripts/render.py --id ${{ steps.pick.outputs.id }}

      - name: (연습) 이미지를 결과물로 저장
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ steps.pick.outputs.name }}
          path: |
            output/${{ steps.pick.outputs.name }}.jpg
            output/${{ steps.pick.outputs.name }}.txt

      - name: 이미지를 저장소에 올려 공개 주소 만들기
        id: upload
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "output/${{ steps.pick.outputs.name }}.jpg"
          git commit -m "이미지: ${{ steps.pick.outputs.id }}번 문제" || echo "이미 올라간 이미지"
          git pull --rebase
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 인스타에 게시
        if: ${{ !inputs.dry_run }}
        run: >
          python scripts/publish.py
          --id ${{ steps.pick.outputs.id }}
          --image-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.upload.outputs.sha }}/output/${{ steps.pick.outputs.name }}.jpg"

      - name: 게시 기록 저장
        if: ${{ !inputs.dry_run }}
        run: |
          git add state/posted.json
          git commit -m "게시 완료: ${{ steps.pick.outputs.id }}번 문제"
          git pull --rebase
          git push
